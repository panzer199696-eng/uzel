# Память под Gradle-демон и UTF-8: исходники с русскими комментариями.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
# С 0.2.0 экран на Compose — нужен AndroidX.
android.useAndroidX=true
# Путь проекта на этой машине содержит кириллицу («Разработка на питоне») —
# AGP приостанавливает проверку пути; сборка при этом проходит.
android.overridePathCheck=true
kotlin.code.style=official
