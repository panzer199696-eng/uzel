#
# Прошивка УЗЛА (XIAO nRF52840 Sense, загрузчик Adafruit UF2).
# Версия прошивки — CONFIG_BT_DIS_FW_REV_STR ниже: из неё build.sh делает имя файла.
#

CONFIG_GPIO=y
CONFIG_NRFX_PDM=y
CONFIG_ADC=y
CONFIG_FPU=y
CONFIG_RING_BUFFER=y
CONFIG_REBOOT=y
# Сбой ядра (стек, BT_ASSERT, таймаут HCI) — перезагрузка, а не тихая остановка
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_PM_DEVICE=y
CONFIG_NORDIC_QSPI_NOR=n
CONFIG_I2C=n
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=512

#
# Bluetooth: один периферийный канал
#
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="UZEL"
CONFIG_BT_DEVICE_APPEARANCE=22
CONFIG_BT_MAX_CONN=1
CONFIG_BT_CTLR_TX_PWR_ANTENNA=8

# Сопряжение Just Works с хранением ключей во флеше (storage_partition 0xEC000).
# Новое устройство принимается, только пока сопряжённых нет или кулон на USB
# (transport.c, pairing_accept). Мест — на телефон, ПК и запасное.
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_PAIRED=3
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
# Телефон, потерявший ключи, должен суметь сопрячься заново (на зарядке)
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Обмен MTU начинает сам кулон: раньше кадры не уходили вовсе, если телефон
# не запрашивал MTU (оставался 23 байта).
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_PHY_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=y
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=400000
CONFIG_BT_CONN_TX_MAX=20
CONFIG_BT_L2CAP_TX_BUF_COUNT=10

#
# Сервисы: батарея и сведения об устройстве
#
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n
CONFIG_BT_DIS_MODEL="UZEL Triangle v1"
CONFIG_BT_DIS_MANUF="UZEL"
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_FW_REV_STR="0.1.3"
CONFIG_BT_DIS_HW_REV=y
CONFIG_BT_DIS_HW_REV_STR="XIAO nRF52840 Sense"

#
# Консоль и логи выключены (включаются в prj_uzel_debug.conf)
#
CONFIG_CONSOLE=n
CONFIG_PRINTK=n
